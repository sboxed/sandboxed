name: sandboxed_ui_kit
description: "A reusable component library for the Sandboxed UI development environment. Includes isolated widgets, themes, and layout utilities for rapid prototyping and testing."
resolution: workspace
version: 0.2.0 # x-release-please-version
homepage: https://sboxed.com/

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  material_ui: ^1.10.0
  flutter:
    sdk: flutter

  # ui
  flutter_markdown_plus: ^1.0.12
  iconify_flutter_plus: ^1.0.4
  flutter_resizable_container: ^4.2.0
  two_dimensional_scrollables: ^0.5.6
  flex_color_picker: ^4.0.0

  # core
  markdown: ^7.3.1

  # stories
  faker: ^2.2.0
  sandboxed_core: ^0.2.0 # x-release-please-version

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  checks: ^0.3.2

flutter:
  uses-material-design: true

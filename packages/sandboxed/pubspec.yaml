name: sandboxed
description: "A Flutter toolkit for building, testing, and presenting UI components in isolation with a focus on speed, modularity, and developer experience."
resolution: workspace
version: 0.1.9+2 # x-release-please-version
homepage: https://sboxed.com/
repository: https://github.com/sboxed/sandboxed
issue_tracker: https://github.com/sboxed/sandboxed/issues

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  material_ui: ^1.10.0
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  sandboxed_core: ^0.1.6+1 # x-release-please-version

  # ui
  google_fonts: ^9.0.0
  iconify_flutter_plus: ^1.0.4


  # editor
  recursive_tree_flutter: ^1.0.4
  flutter_resizable_container: ^4.2.0

  # persistence
  shared_preferences: ^2.5.6

  # component utility
  flutter_markdown_plus: ^1.0.12
  url_launcher: ^6.3.3


  # addons dependencies
  device_frame_plus: ^1.5.0

  # riverpod
  flutter_riverpod: ^3.5.0

  # utility
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  collection: ^1.19.1
  equatable: ^2.1.0
  flat: ^0.5.0
  super_clipboard: ^0.9.1

  # internal
  sandboxed_ui_kit: ^0.1.3+5 # x-release-please-version

dev_dependencies:
  flutter_test:
    sdk: flutter

  # test
  checks: ^0.3.2

  # code style
  flutter_lints: ^6.0.0

  # generator
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.15.2

flutter:
  uses-material-design: true

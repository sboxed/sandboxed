name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MELOS_SDK_PATH: auto

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test release changelog sync
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check shared release versions
        if: startsWith(github.head_ref, 'release-please--')
        run: python3 .github/scripts/check-release.py

      - run: dart analyze --fatal-infos

      - name: Run tests
        run: >-
          dart run melos exec
          --flutter
          --dir-exists=test
          --concurrency=2
          --fail-fast
          -- flutter test --no-pub

      - name: Validate pub.dev publication
        if: startsWith(github.head_ref, 'release-please--')
        run: dart run melos publish --dry-run --yes

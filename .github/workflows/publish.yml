name: Publish to pub.dev

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

concurrency:
  group: publish-pub-dev
  cancel-in-progress: false

env:
  MELOS_SDK_PATH: auto

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check tag and shared release versions
        run: python3 .github/scripts/check-release.py

      - run: dart analyze --fatal-infos

      - name: Run tests
        run: >-
          dart run melos exec
          --flutter
          --dir-exists=test
          --concurrency=2
          --fail-fast
          -- flutter test --no-pub

      - name: Read Flutter's Dart version
        id: dart
        run: echo "version=$(dart --version | awk '{print $4}')" >> "$GITHUB_OUTPUT"

      - name: Authenticate to pub.dev with OIDC
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: ${{ steps.dart.outputs.version }}

      - name: Publish packages in dependency order
        run: dart run melos publish --no-dry-run --yes --no-git-tag-version
